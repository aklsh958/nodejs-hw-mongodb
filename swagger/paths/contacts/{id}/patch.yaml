tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update an existing contact. All fields are optional. Supports image upload via multipart/form-data.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 65e4decdd286b30065d54af9
    description: The unique identifier of the contact
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's name
            example: John David Doe
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+380509876543'
          email:
            type: string
            format: email
            description: Contact's email address
            example: john.updated@example.com
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: work
          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
            example: true
          photo:
            type: string
            format: binary
            description: Contact's photo (JPEG, PNG, GIF, max 5MB)
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    description: Bad request - validation error
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml