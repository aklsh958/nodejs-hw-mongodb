tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user. Supports image upload via multipart/form-data.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact's name
            example: John Doe
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+380501234567'
          email:
            type: string
            format: email
            description: Contact's email address
            example: john@example.com
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: personal
          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
            default: false
            example: false
          photo:
            type: string
            format: binary
            description: Contact's photo (JPEG, PNG, GIF, max 5MB)
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    description: Bad request - validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Bad Request
  '401':
    $ref: ../../components/responses/401.yaml