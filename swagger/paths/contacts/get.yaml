tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Get a paginated list of contacts for the authenticated user with optional filtering and sorting.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
      minimum: 1
    description: Page number for pagination
    example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
    description: Number of items per page
    example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      default: _id
      enum: [_id, name, phoneNumber, email, contactType, createdAt, updatedAt]
    description: Field to sort by
    example: name
  - in: query
    name: sortOrder
    schema:
      type: string
      default: asc
      enum: [asc, desc]
    description: Sort order (ascending or descending)
    example: asc
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type
    example: personal
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter by favourite status
    example: true
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 25
                totalPages:
                  type: integer
                  example: 3
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml