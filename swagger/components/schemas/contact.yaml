type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    type: string
    description: Contact's unique identifier
    example: 65e4decdd286b31065d54af9
  name:
    type: string
    description: Contact's name
    example: Emma Swan
  phoneNumber:
    type: string
    description: Contact's phone number
    example: '+34123657234'
  email:
    type: string
    format: email
    description: Contact's email address
    example: emma@example.com
  isFavourite:
    type: boolean
    description: Whether the contact is marked as favourite
    default: false
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    description: Type of contact
    example: home
  photo:
    type: string
    format: uri
    description: URL to contact's photo
    example: https://res.cloudinary.com/demo/image/upload/contacts/photo.jpg
  userId:
    type: string
    description: ID of the user who owns this contact
    example: 65e4decdd286b30065d54af8
  createdAt:
    type: string
    format: date-time
    description: Contact creation timestamp
    example: '2024-03-15T10:30:00.000Z'
  updatedAt:
    type: string
    format: date-time
    description: Contact last update timestamp
    example: '2024-03-15T10:30:00.000Z'